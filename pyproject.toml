[project]
name = "claude-stocks"
version = "0.1.0"
description = "Personal Claude-powered stock analysis tool with forward-tracking backtest"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "yfinance>=0.2.40",
    "finnhub-python>=2.4.20",
    "alpha-vantage>=2.3.1",
    "apscheduler>=3.10.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["claude_stocks*"]
